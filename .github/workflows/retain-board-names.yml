#    service-role key, FIELD_DB_URL, or the migration-owner URL.
# 3. Add a schedule under `on:` (for example "45 8 * * *") and remove `if: ${{ false }}`.
# The only SQL is:
#   select private.retain_board_names();

on:
  workflow_dispatch:

permissions: {}

jobs:
  retain:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Drop nicknames older than 90 days
        env:
          BOARD_RETENTION_DB_URL: ${{ secrets.BOARD_RETENTION_DB_URL }}
        run: |
          echo "This job is not enabled."
          exit 0
