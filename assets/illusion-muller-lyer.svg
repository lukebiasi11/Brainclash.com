<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Müller-Lyer illusion: two horizontal lines, top and bottom" data-answer="equal">
<!-- GEOMETRY: Top shaft (100,100)-(300,100)=200px, bottom shaft (100,200)-(300,200)=200px. Top has inward arrowheads (<->), bottom outward tails (>-<). Answer: equal. Fins: 30px at ±35° (dx 24.6, dy 17.2), stroke 4, butt caps; fins are not part of the measured shaft. A=top, B=bottom. -->
<rect width="400" height="300" fill="#FFFFFF"/>
<g stroke="#222" stroke-width="4" stroke-linecap="butt" fill="none">
<line data-item="A" x1="100" y1="100" x2="300" y2="100"/><path d="M124.6 82.8L100 100L124.6 117.2M275.4 82.8L300 100L275.4 117.2"/>
<line data-item="B" x1="100" y1="200" x2="300" y2="200"/><path d="M75.4 182.8L100 200L75.4 217.2M324.6 182.8L300 200L324.6 217.2"/>
</g>
<g fill="#222" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="700"><text x="20" y="105">Top</text><text x="20" y="205">Bottom</text></g>
</svg>
