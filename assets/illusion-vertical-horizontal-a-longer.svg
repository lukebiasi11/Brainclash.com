<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Inverted T: horizontal line A and vertical line B" data-answer="A" style="color:currentColor">
<!-- GEOMETRY: horizontal A from (70,250) to (290,250) = 220 units; vertical B from (180,250) to (180,50) = 200 units. A = 1.10 x B. Answer: A. -->
<g stroke="currentColor" stroke-width="5" stroke-linecap="butt">
<line data-item="A" x1="70" y1="250" x2="290" y2="250"/>
<line data-item="B" x1="180" y1="250" x2="180" y2="50"/>
</g>
<g fill="currentColor" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="22" font-weight="700" text-anchor="middle">
<text x="50" y="258">A</text><text x="205" y="70">B</text>
</g>
</svg>
